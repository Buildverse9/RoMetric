name = "rometric-collector"
main = "cloudflare-collector-worker.ts"
compatibility_date = "2026-01-01"

# Cloudflare Workers Free allows up to 3 Cron Triggers per Worker
# (50 subrequests/run, 10ms active CPU/run, 100,000 requests/day):
#
# 1) Every 1 minute  (`* * * * *`, 1,440 runs/day):
#      Adaptive CCU pulse for up to 900 stalest active games (>35 min old).
#      Uses 18 Roblox v1/games calls (50 IDs/call, 2-wide waves, header-governed
#      zero-429 brake) + ~5 Supabase calls = ~23/50 subrequests, ~4-6ms CPU.
#      Scales automatically up to 27,000 games / 30 min (54,000 / 60 min) and
#      exits in 1 subrequest (<1ms CPU) when all games are already fresh.
#      Bonus: Passively extracts newly announced promo codes from the game
#      descriptions already returned by v1/games for ZERO extra Roblox calls.
#
# 2) Every 15 minutes (`*/15 * * * *`, 96 runs/day):
#      - Fast 25+ CCU Breakout Catcher scanning Roblox Explore Trending /
#        Up-and-Coming / Top Playing sorts + passive description code extraction.
#      - Tier 2 Warm History Sync (Cloudflare D1 — 5 GB Free, NO credit card, $0 egress):
#        Updates 1 of 32 deterministic game partitions per tick (every game syncs 3x/day,
#        staying well under D1's 100k free writes/day) storing 14d hourly + 5y daily charts.
#      - Every 6 hours (00:00, 06:00, 12:00, 18:00 UTC): runs Supabase
#        `run_rometric_retention_rollup` so Tier 1 Hot storage stays compact.
#
# 3) Daily 03:00 UTC (`0 3 * * *`, 1 run/day):
#      Deactivates long-dormant games (<15 CCU for 7+ days, peak <100) and
#      executes `run_rometric_retention_rollup`.
[triggers]
crons = [
  "* * * * *",
  "*/15 * * * *",
  "0 3 * * *"
]

# Tier 2 Warm History Storage — Cloudflare D1 (5 GB Free, NO Credit Card / PayPal, $0 Egress)
# How to activate (2 clicks in dash.cloudflare.com):
#   1. Go to Storage & Databases -> D1 SQL Database -> Create -> name it `rometric-history`.
#   2. Either bind it in Workers -> rometric-collector -> Settings -> Bindings -> Add -> D1 database
#      with Variable name `HISTORY_DB` (recommended for Git deploys), OR uncomment below with your database_id:
#
# [[d1_databases]]
# binding = "HISTORY_DB"
# database_name = "rometric-history"
# database_id = "YOUR_D1_DATABASE_ID"


